<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Speed Hub - المنصة الاحترافية</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="hero-glow"></div>
    
    <div class="navbar">
        <div class="logo">⚡ PS5 Speed Hub</div>
        <div class="badge">النظام الآمن والمشفر</div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>تسريع ثغرات بلايستيشن 5</h2>
                <p>أنشئ مستودعاً وموقعاً سحابياً مسرعاً بثغرتك بضغطة زر واحدة بكل أمان.</p>
            </div>
            
            <form id="speedForm">
                <div class="form-group">
                    <label for="exploitUrl">رابط الثغرة (Raw URL):</label>
                    <input type="url" id="exploitUrl" class="form-control" placeholder="https://raw.githubusercontent.com/..." required>
                </div>

                <div class="form-group">
                    <label for="speedLevel">مستوى التسريع المطلوب:</label>
                    <select id="speedLevel" class="form-control">
                        <option value="1">سرعة قياسية (1x)</option>
                        <option value="5">سرعة مضاعفة (5x)</option>
                        <option value="10">سرعة فائقة جداً (10x)</option>
                    </select>
                </div>

                <button type="submit" class="btn" id="submitBtn">بدء التسريع والنشر الفوري 🚀</button>
            </form>

            <div id="statusMessage" class="status-box"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
