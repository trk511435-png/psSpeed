<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>psSpeedX - PlayStation 5 Exploit Accelerator</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --card-bg: #161b22;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Lang Buttons */
        .lang-btn {
            position: absolute;
            top: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .lang-btn:hover {
            background-color: #30363d;
        }

        #lang-ar {
            right: 20px;
        }

        #lang-en {
            left: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #ffffff;
        }

        p.subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button.submit-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.submit-btn:hover {
            background-color: #2ea043;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <!-- Language Buttons -->
    <button id="lang-ar" class="lang-btn" onclick="setLanguage('ar')">
        <span>🇦🇪</span> العربية
    </button>
    <button id="lang-en" class="lang-btn" style="display:none;" onclick="setLanguage('en')">
        <span>🇬🇧</span> English
    </button>

    <div class="container">
        <h1 id="t-title">psSpeedX</h1>
        <p class="subtitle" id="t-subtitle">PlayStation 5 Exploit Accelerator & Automation Platform</p>

        <div class="form-group">
            <label id="t-label-url">Exploit URL:</label>
            <input type="text" id="exploitUrl" placeholder="Enter exploit link...">
        </div>

        <div class="form-group">
            <label id="t-label-speed">Attempts Per Second:</label>
            <select id="speedSelect">
                <option value="10">10 Attempts/s</option>
                <option value="20" selected>20 Attempts/s (Recommended)</option>
                <option value="30">30 Attempts/s</option>
                <option value="50">50 Attempts/s</option>
            </select>
        </div>

        <button class="submit-btn" id="t-btn-generate" onclick="generatePayload()">Generate Optimized psSpeedX</button>

        <div class="footer" id="t-footer">
            Powered by WSL-3 &bull; psSpeedX System
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: "psSpeedX",
                subtitle: "PlayStation 5 Exploit Accelerator & Automation Platform",
                labelUrl: "Exploit URL:",
                labelSpeed: "Attempts Per Second:",
                btnGenerate: "Generate Optimized psSpeedX",
                footer: "Powered by WSL-3 • psSpeedX System"
            },
            ar: {
                title: "psSpeedX",
                subtitle: "منصة أتمتة وتسريع ثغرات بلايستيشن 5",
                labelUrl: "رابط الثغرة:",
                labelSpeed: "عدد المحاولات في الثانية:",
                btnGenerate: "إنشاء نسخة psSpeedX المحسنة",
                footer: "بدعم من WSL-3 • نظام psSpeedX"
            }
        };

        function setLanguage(lang) {
            const html = document.documentElement;
            if (lang === 'ar') {
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', 'ar');
                document.getElementById('lang-ar').style.display = 'none';
                document.getElementById('lang-en').style.display = 'flex';
                
                document.getElementById('t-title').innerText = translations.ar.title;
                document.getElementById('t-subtitle').innerText = translations.ar.subtitle;
                document.getElementById('t-label-url').innerText = translations.ar.labelUrl;
                document.getElementById('t-label-speed').innerText = translations.ar.labelSpeed;
                document.getElementById('t-btn-generate').innerText = translations.ar.btnGenerate;
                document.getElementById('t-footer').innerHTML = translations.ar.footer;
                document.getElementById('exploitUrl').placeholder = "أدخل رابط الثغرة هنا...";
            } else {
                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', 'en');
                document.getElementById('lang-en').style.display = 'none';
                document.getElementById('lang-ar').style.display = 'flex';
                
                document.getElementById('t-title').innerText = translations.en.title;
                document.getElementById('t-subtitle').innerText = translations.en.subtitle;
                document.getElementById('t-label-url').innerText = translations.en.labelUrl;
                document.getElementById('t-label-speed').innerText = translations.en.labelSpeed;
                document.getElementById('t-btn-generate').innerText = translations.en.btnGenerate;
                document.getElementById('t-footer').innerHTML = translations.en.footer;
                document.getElementById('exploitUrl').placeholder = "Enter exploit link...";
            }
            localStorage.setItem('ps_lang', lang);
        }

        function generatePayload() {
            const url = document.getElementById('exploitUrl').value;
            const speed = document.getElementById('speedSelect').value;
            if(!url) {
                alert(document.documentElement.lang === 'ar' ? 'الرجاء إدخال رابط الثغرة أولاً!' : 'Please enter the exploit URL first!');
                return;
            }
            alert(document.documentElement.lang === 'ar' ? 'جاري إرسال الطلب للـ API وتوليد المستودع...' : 'Sending request to API and generating repository...');
        }

        // استرجاع اللغة المحفوظة تلقائياً لو وُجدت
        window.onload = function() {
            const savedLang = localStorage.getItem('ps_lang') || 'en';
            if(savedLang === 'ar') {
                setLanguage('ar');
            }
        };
    </script>
</body>
</html>
