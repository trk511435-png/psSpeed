<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Speed Hub</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="navbar">
        <div>
            <a href="index.html" style="color: #3b82f6;">الصفحة الرئيسية</a>
            <a href="dashboard.html">الأرشيف (Dashboard)</a>
        </div>
        <div style="font-weight: bold;">PS5 Speed Hub</div>
    </div>

    <div class="container">
        <div class="card">
            <h2>تسريع ثغرات PS5</h2>
            <p style="color: #94a3b8;">أنشئ مستودعاً وموقعاً جاهزاً ومسرعاً بثغرتك بضغطة زر واحدة دون تعقيد.</p>
            
            <form id="speedForm">
                <div class="form-group">
                    <label for="exploitUrl">رابط الثغرة (Raw URL):</label>
                    <input type="url" id="exploitUrl" class="form-control" placeholder="https://raw.githubusercontent.com/..." required>
                </div>

                <div class="form-group">
                    <label for="speedLevel">مستوى السرعة:</label>
                    <select id="speedLevel" class="form-control">
                        <option value="1">سرعة عادية (1x)</option>
                        <option value="5">سرعة عالية (5x)</option>
                        <option value="10">سرعة فائقة (10x)</option>
                    </select>
                </div>

                <button type="submit" class="btn" id="submitBtn">بدء التسريع والنشر 🚀</button>
            </form>

            <div id="statusMessage" style="margin-top: 20px; text-align: center; font-weight: bold;"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
